<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <title>SN Scanner (Pro Tracking)</title>
  
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f6fb; --card: #fff; --ink: #182338; --muted: #6b7890;
      --line: #e3e9f2; --blue: #2563eb; --blue-soft: #edf4ff;
      --green: #087f5b; --green-bg: #e8f8f1; --red: #c73535; --red-bg: #fff0ef;
      --shadow: 0 8px 28px rgba(31, 53, 87, .07);
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: max(16px, env(safe-area-inset-top)) 14px max(24px, env(safe-area-inset-bottom)); background: var(--bg); color: var(--ink); font-family: "Sarabun", system-ui, sans-serif; }
    .wrap { width: 100%; max-width: 620px; margin: 0 auto; }
    header { padding: 14px 4px 18px; }
    .eyebrow { color: var(--blue); font-size: 12px; font-weight: 800; letter-spacing: .12em; }
    h1 { margin: 4px 0 3px; font-size: clamp(23px, 6vw, 28px); line-height: 1.2; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 17px; margin-bottom: 14px; box-shadow: var(--shadow); }
    h2 { margin: 0 0 10px 0; font-size: 17px; }
    .hint { margin: 0 0 10px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    
    textarea { display: block; width: 100%; min-height: 70px; resize: vertical; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: #fbfcff; font: inherit; font-size: 14px; outline: none; }
    textarea:focus { border-color: #8bb2ff; box-shadow: 0 0 0 3px #2563eb18; }
    
    .actions { display: flex; gap: 9px; margin-top: 10px; }
    .btn { flex: 1; min-height: 44px; border: 0; border-radius: 10px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn-primary { background: var(--blue); color: white; }
    .btn-secondary { background: #f0f3f8; color: #46536a; }

    /* Dashboard ติดตามสถานะ */
    .tracking-dashboard { display: flex; gap: 10px; margin-top: 15px; }
    .tracking-col { flex: 1; background: #f8f9fa; padding: 10px; border-radius: 12px; border: 1px solid var(--line); }
    .tracking-col h3 { font-size: 14px; margin: 0 0 10px 0; color: #182338; display: flex; justify-content: space-between; align-items: center;}
    .badge { background: var(--muted); color: white; padding: 2px 6px; border-radius: 10px; font-size: 11px; }
    .badge.green { background: var(--green); }
    .badge.red { background: var(--red); }
    .status-list { display: flex; flex-direction: column; gap: 5px; max-height: 150px; overflow-y: auto; }
    .status-item { font-size: 13px; padding: 6px 8px; border-radius: 8px; word-break: break-all; }
    .item-pending { background: #fff; border: 1px solid #dee2e6; color: #6b7890; }
    .item-found { background: var(--green-bg); border: 1px solid #b9ead5; color: var(--green); font-weight: bold; }

    /* Tabs */
    .tabs { display: flex; background: #e3e9f2; border-radius: 14px; padding: 4px; margin-bottom: 15px; }
    .tab-btn { flex: 1; text-align: center; padding: 10px; border-radius: 10px; border: none; background: transparent; color: var(--muted); font-weight: 700; font-size: 15px; cursor: pointer; font-family: inherit; transition: all 0.2s; }
    .tab-btn.active { background: white; color: var(--blue); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .view-section { display: none; }
    .view-section.active { display: block; animation: fadeIn 0.3s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* Camera UI (Core) */
    #reader { width: 100%; overflow: hidden; border-radius: 14px; background: #000; position: relative; min-height: 250px;}
    #reader video { border-radius: 12px; object-fit: cover; width: 100%; height: 100%; display: block;}
    
    .zoom-container { display: none; margin-top: 10px; padding: 12px; background: #f0f3f8; border-radius: 10px; align-items: center; gap: 10px; }
    .zoom-container label { font-weight: 600; font-size: 13px; white-space: nowrap; }
    input[type=range] { flex: 1; accent-color: var(--blue); }
    #zoom-value { font-weight: bold; color: var(--blue); min-width: 35px; text-align: right; }

    /* OCR UI */
    .camera-btn-ocr { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 60px; background: var(--blue); color: white; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; }
    #loading-ocr { display: none; text-align: center; color: var(--blue); margin-top: 15px; font-weight: bold; font-size: 14px; padding: 15px; background: #edf4ff; border-radius: 10px;}

    /* Result Alert */
    #result-overlay { display: none; padding: 16px; border-radius: 16px; margin-top: 15px; overflow-wrap: anywhere; }
    #result-overlay.match { display: block; color: var(--green); background: var(--green-bg); border: 2px solid var(--green); }
    .result-title { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
    .result-value { color: var(--ink); background: rgba(255,255,255,.9); border-radius: 10px; padding: 10px; font-size: 14px; font-family: monospace; }
    #resume-btn { width: 100%; margin-top: 12px; background: var(--green); color: #fff; min-height: 50px; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer;}
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="eyebrow">SMART SN TRACKER</div>
      <h1>เครื่องมือสแกนและติดตาม SN</h1>
    </header>

    <section class="card">
      <h2>1. ใส่รายชื่อ SN (บรรทัดละ 1 ตัว)</h2>
      <textarea id="target-sns" placeholder="Q00K42G3&#10;M6402664349"></textarea>
      <div class="actions">
        <button class="btn btn-primary" id="save-btn">บันทึก & เริ่มค้นหา</button>
        <button class="btn btn-secondary" id="clear-btn">ล้างข้อมูล</button>
      </div>

      <!-- แดชบอร์ดติดตามสถานะ -->
      <div class="tracking-dashboard">
        <div class="tracking-col">
          <h3>⏳ ยังไม่เจอ <span class="badge red" id="pending-count">0</span></h3>
          <div class="status-list" id="pending-list"></div>
        </div>
        <div class="tracking-col">
          <h3>✅ เจอแล้ว <span class="badge green" id="found-count">0</span></h3>
          <div class="status-list" id="found-list"></div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="tabs">
        <button class="tab-btn active" id="tab-barcode" onclick="switchTab('barcode')">สแกนบาร์โค้ด</button>
        <button class="tab-btn" id="tab-ocr" onclick="switchTab('ocr')">ถ่ายรูป (OCR)</button>
      </div>

      <div id="view-barcode" class="view-section active">
        <!-- กล่องวิดีโอแบบใหม่ ไม่มีปุ่มของระบบกวนใจ -->
        <div id="reader"></div>
        <div class="zoom-container" id="zoom-container">
            <label for="zoom-slider">🔍 ซูม:</label>
            <input type="range" id="zoom-slider" min="1" max="3" step="0.1" value="1">
            <span id="zoom-value">1.0x</span>
        </div>
      </div>

      <div id="view-ocr" class="view-section">
        <label for="camera-input" class="camera-btn-ocr">📸 เปิดกล้องถ่ายรูปสติ๊กเกอร์</label>
        <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none;">
        <div id="loading-ocr">⏳ กำลังอ่านตัวหนังสือจากรูป... (2-4 วิ)</div>
      </div>

      <!-- กล่องแจ้งเตือนเมื่อเจอเป้าหมาย -->
      <div id="result-overlay">
        <div class="result-title" id="result-title"></div>
        <div class="result-value" id="result-value"></div>
        <button id="resume-btn" onclick="resumeScanning()">รับทราบ & สแกนต่อ</button>
      </div>
    </section>
  </main>

  <script>
    let html5QrCode;
    let cameraTrack = null; 
    let allTargets = [];
    let foundTargets = new Set();
    let isPaused = false; 
    let audioCtx;

    // ----- ระบบเสียงเตือน (Web Audio API) ดังสนั่น -----
    function initAudio() {
      if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      if (audioCtx.state === 'suspended') { audioCtx.resume(); }
    }
    
    function playLoudBeep() {
      initAudio();
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      
      oscillator.type = 'square'; 
      oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); 
      oscillator.frequency.exponentialRampToValueAtTime(1500, audioCtx.currentTime + 0.1); 
      
      gainNode.gain.setValueAtTime(1, audioCtx.currentTime); 
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6); 
      
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      oscillator.start();
      oscillator.stop(audioCtx.currentTime + 0.6);
    }

    // ----- จัดการรายชื่อ (Tracking) -----
    function loadTargets() {
      const text = document.getElementById('target-sns').value;
      allTargets = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      renderTrackingUI();
    }

    function renderTrackingUI() {
      const pendingList = document.getElementById('pending-list');
      const foundList = document.getElementById('found-list');
      pendingList.innerHTML = ''; foundList.innerHTML = '';
      let pCount = 0, fCount = 0;

      allTargets.forEach(target => {
        const div = document.createElement('div');
        div.textContent = target;
        if (foundTargets.has(target)) {
          div.className = 'status-item item-found';
          foundList.appendChild(div);
          fCount++;
        } else {
          div.className = 'status-item item-pending';
          pendingList.appendChild(div);
          pCount++;
        }
      });
      document.getElementById('pending-count').textContent = pCount;
      document.getElementById('found-count').textContent = fCount;
    }

    document.getElementById('save-btn').addEventListener('click', () => {
      initAudio(); // ขออนุญาตใช้เสียงจากระบบ
      loadTargets();
      try { localStorage.setItem('sn-target-list-pro', document.getElementById('target-sns').value); } catch(e){}
      document.getElementById('save-btn').textContent = 'บันทึกแล้ว ✓';
      setTimeout(() => document.getElementById('save-btn').textContent = 'บันทึก & เริ่มค้นหา', 1500);
      
      // ถ้ากล้องยังไม่ทำงาน ให้เรียกกล้องขึ้นมาเลย
      if (!html5QrCode) { initBarcodeScanner(); }
    });

    document.getElementById('clear-btn').addEventListener('click', () => {
      document.getElementById('target-sns').value = '';
      foundTargets.clear();
      loadTargets();
      try { localStorage.removeItem('sn-target-list-pro'); } catch(e){}
    });

    try { 
      document.getElementById('target-sns').value = localStorage.getItem('sn-target-list-pro') || ''; 
      loadTargets();
    } catch(e){}


    // ----- ฟังก์ชันประมวลผลการสแกน -----
    function processResult(extractedText, source) {
      if (isPaused) return; // บล็อกการประมวลผลถ้าเจอแล้ว 

      let matchedTarget = null;
      for (let target of allTargets) {
        if (extractedText.includes(target) && !foundTargets.has(target)) {
          matchedTarget = target;
          break;
        }
      }

      if (matchedTarget) {
        foundTargets.add(matchedTarget);
        renderTrackingUI();
        
        isPaused = true; // ล็อกไม่ให้สแกนตัวอื่นต่อ
        playLoudBeep();  // ส่งเสียงเตือน
        if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);

        const resBox = document.getElementById('result-overlay');
        resBox.className = 'match';
        document.getElementById('result-title').textContent = `✅ เจอเป้าหมายใหม่: ${matchedTarget}`;
        document.getElementById('result-value').textContent = `ข้อมูล: ${extractedText}`;
        resBox.style.display = 'block';
        
      } else if (source === 'ocr') {
        alert("ไม่พบเป้าหมายใหม่ในรูปภาพ หรือรูปอาจเบลอเกินไป ลองถ่ายใหม่อีกครั้งครับ");
      }
    }

    function resumeScanning() {
      document.getElementById('result-overlay').style.display = 'none';
      isPaused = false; // ปลดล็อกให้สแกนตัวต่อไปได้
    }


    // ----- ระบบ Zoom กล้อง -----
    function setupCameraZoom() {
        const videoElement = document.querySelector('#reader video');
        if (!videoElement) return;
        const stream = videoElement.srcObject;
        if (!stream) return;
        cameraTrack = stream.getVideoTracks()[0];
        if (!cameraTrack) return;

        const capabilities = cameraTrack.getCapabilities();
        if (capabilities.zoom) {
            const zoomSlider = document.getElementById('zoom-slider');
            zoomSlider.min = capabilities.zoom.min;
            zoomSlider.max = capabilities.zoom.max;
            zoomSlider.step = capabilities.zoom.step;
            
            let defaultZoom = 2.0;
            if (defaultZoom > capabilities.zoom.max) defaultZoom = capabilities.zoom.max;
            if (defaultZoom < capabilities.zoom.min) defaultZoom = capabilities.zoom.min;
            
            zoomSlider.value = defaultZoom;
            document.getElementById('zoom-value').textContent = defaultZoom.toFixed(1) + 'x';
            
            cameraTrack.applyConstraints({ advanced: [{ zoom: defaultZoom }] }).catch(e => console.log(e));
            document.getElementById('zoom-container').style.display = 'flex';
        }
    }

    document.getElementById('zoom-slider').addEventListener('input', (event) => {
        const zoomLevel = parseFloat(event.target.value);
        document.getElementById('zoom-value').textContent = zoomLevel.toFixed(1) + 'x';
        if (cameraTrack) {
            cameraTrack.applyConstraints({ advanced: [{ zoom: zoomLevel }] }).catch(e => console.log(e));
        }
    });

    // ----- ระบบ Barcode (Core API แก้บั๊ก iOS) -----
    function initBarcodeScanner() {
      if (!window.Html5Qrcode) return;
      
      html5QrCode = new Html5Qrcode("reader");
      const config = { fps: 10, qrbox: { width: 220, height: 220 } };

      // ดึงเลนส์กล้องมาใช้งานโดยตรง ไม่ผ่าน UI อัตโนมัติ
      html5QrCode.start(
        { facingMode: "environment" }, 
        config,
        (decodedText) => processResult(decodedText, 'barcode'),
        (errorMessage) => { /* ปล่อยว่างเพื่อไม่ให้มีข้อความรบกวน */ }
      ).then(() => {
        // เมื่อกล้องเปิดสำเร็จ ให้ตั้งค่าการซูม
        setTimeout(setupCameraZoom, 500); 
      }).catch((err) => {
        console.error("Camera start failed", err);
      });
    }
    
    window.addEventListener('load', initBarcodeScanner);

    // ----- ระบบ OCR -----
    document.getElementById('camera-input').addEventListener('change', async (e) => {
      if (!e.target.files || e.target.files.length === 0) return;
      document.getElementById('loading-ocr').style.display = 'block';

      try {
        const worker = await Tesseract.createWorker('eng');
        const ret = await worker.recognize(e.target.files[0]);
        await worker.terminate();
        processResult(ret.data.text, 'ocr');
      } catch (error) {
        alert('เกิดข้อผิดพลาดในการดึงข้อความ');
      } finally {
        document.getElementById('loading-ocr').style.display = 'none';
        e.target.value = ''; 
      }
    });

    // ----- สลับแท็บ -----
    function switchTab(mode) {
      document.getElementById('tab-barcode').className = mode === 'barcode' ? 'tab-btn active' : 'tab-btn';
      document.getElementById('tab-ocr').className = mode === 'ocr' ? 'tab-btn active' : 'tab-btn';
      document.getElementById('view-barcode').className = mode === 'barcode' ? 'view-section active' : 'view-section';
      document.getElementById('view-ocr').className = mode === 'ocr' ? 'view-section active' : 'view-section';
    }
  </script>
</body>
</html>
